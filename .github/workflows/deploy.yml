name: Deploy to Beget

on:
  push:
    branches:
      - main  # ветка, при пуше в которую будет запускаться деплой

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Проверка кода
      uses: actions/checkout@v3

    - name: Настройка SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Создание архива для деплоя
      run: |
        tar -czf deploy.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.github' \
          --exclude='Temp' \
          --exclude='Crowdfunding' \
          --exclude='*.md' \
          --exclude='*.txt' \
          --exclude='*.log' \
          .

    - name: Деплой на Beget
      run: |
        # Копируем архив на сервер
        scp -o StrictHostKeyChecking=no deploy.tar.gz chuchuc3@chuchuc3.beget.tech:~/deploy.tar.gz
        
        # Распаковываем и деплоим
        ssh -o StrictHostKeyChecking=no chuchuc3@chuchuc3.beget.tech "
          cd ../shiftlog/public_html &&
          rm -rf * &&
          tar -xzf ~/deploy.tar.gz &&
          rm ~/deploy.tar.gz &&
          echo 'Деплой завершен успешно!'
        "

    - name: Проверка деплоя
      run: |
        echo "Проверяем доступность сайта..."
        sleep 10
        curl -f https://chuchuc3.beget.tech || echo "Сайт еще не доступен" 
[build]
  # Команда сборки (не нужна для статического сайта)
  command = ""
  # Папка для публикации
  publish = "."
  
[build.environment]
  # Node.js версия (если понадобится)
  NODE_VERSION = "18"

# Настройки заголовков для безопасности и PWA
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' https://*.supabase.co https://*.netlify.app; script-src 'self' 'unsafe-inline' https://*.supabase.co https://cdn.jsdelivr.net https://unpkg.com https://cdn.skypack.dev https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.supabase.co; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://r2cdn.perplexity.ai"

# Специальная настройка для манифеста PWA
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# Настройка для Service Worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript"

# Настройка кэширования для статических ресурсов
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"  # 1 день для CSS
    
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"   # 1 час для JS (чтобы видеть обновления быстрее)

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Принудительное HTTPS
[[redirects]]
  from = "http://shiftlog.netlify.app/*"
  to = "https://shiftlog.netlify.app/:splat"
  status = 301
  force = true

# Service Worker перенаправление
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

# SPA перенаправления для всех маршрутов
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 